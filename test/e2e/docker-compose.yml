# scripts/e2e-n8n.js가 쓰는 테스트 환경. 운영 compose와 따로 띄우고, 데이터는 임시 폴더에 직접 연결해 Docker volume을 만들지 않는다.
# Discord 노드는 https://discord.com/api/v10 고정이라, 이 네트워크 안에서만 discord.com을 가짜 서버로 돌리고
# 실행할 때 만든 테스트 CA를 n8n이 믿게 한다(NODE_EXTRA_CA_CERTS).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.6
    ports:
      - "127.0.0.1:25678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Seoul
      - TZ=Asia/Seoul
      - N8N_ENCRYPTION_KEY=e2e-only-not-a-secret
      - N8N_RESTRICT_FILE_ACCESS_TO=/recordings
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - NODE_EXTRA_CA_CERTS=/certs/ca.pem
    volumes:
      - ${E2E_DIR}/n8n:/home/node/.n8n
      - ${E2E_DIR}/recordings:/recordings:ro
      - ${E2E_DIR}/import:/import:ro
      - ${E2E_DIR}/certs/ca.pem:/certs/ca.pem:ro
  mock:
    image: node:24-bookworm-slim
    working_dir: /app
    command: ["node", "mock-apis.js"]
    ports:
      - "127.0.0.1:28080:8080"
    volumes:
      - ./mock-apis.js:/app/mock-apis.js:ro
      - ${E2E_DIR}/certs:/certs:ro
    networks:
      default:
        aliases:
          - discord.com
