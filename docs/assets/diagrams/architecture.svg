<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">meeting-bot 시스템 구성</title>
        <desc id="architecture-desc">녹음 봇과 n8n이 Oracle A1 서버의 Docker compose 안에서 recordings 볼륨을 공유하고, Discord에서 음성과 반응·버튼을 받아 OpenAI로 녹취와 초안을 만든 뒤 승인된 회의록을 ClickUp에 쓰는 구성.</desc>
