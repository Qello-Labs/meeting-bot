        <title id="sequence-pipeline-title">회의 종료부터 초안 게시까지</title>
        <desc id="sequence-pipeline-desc">회의 종료 명령부터 회의 채널에 초안과 승인 버튼이 올라갈 때까지의 순서: 녹음 봇이 manifest를 보내면 n8n이 바로 응답하고, 결정 메시지 조회, 발화별 음성 인식, 템플릿 읽기, 초안 작성, 코드 근거 검증을 거친다.</desc>
