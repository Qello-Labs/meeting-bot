      #sequence-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sequence-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #sequence-pipeline-root .diagram-container { overflow-x: visible; }</style>
